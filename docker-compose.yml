services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-backend
    env_file:
      - .env
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churn-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
